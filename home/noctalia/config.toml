[nightlight]
enabled = true

[notification]
filter_order = [ "filter" ]
history_retention_hours = 1

    [notification.filter.filter]
    allow_permanent = true
    bypass_dnd = false
    enabled = true
    match = "notify send"
    match_content = "Switched to:"
    play_sound = true
    save_history = false
    show_toast = true

[plugins]
enabled = []

[shell]
avatar_path = "/home/jason/Pictures/wallpapers/dark/astronaut_jellyfish.jpg"
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    categories = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.wallpaper]
        global = false

        [shell.launcher.providers.windows]
        global = false

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_launcher = true
    transparency_mode = "soft"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "auto"
pure_black_dark = true
shell_mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/jason/Pictures/wallpapers"
directory_dark = "/home/jason/Pictures/wallpapers/dark"
directory_light = "/home/jason/Pictures/wallpapers/light"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 3600

    [wallpaper.default]
    path = "/home/jason/Pictures/wallpapers/dark/milkyway.png"

    [wallpaper.last]
    path = "/home/jason/Pictures/wallpapers/dark/milkyway.png"

    [wallpaper.monitors.DP-2]
    path = "/home/jason/Pictures/wallpapers/dark/milkyway.png"

    [wallpaper.monitors.DP-3]
    path = "/home/jason/Pictures/wallpapers/dark/milkyway.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/jason/Pictures/wallpapers/dark/milkyway.png"

[weather]
unit = "imperial"

[widget.clock]
anchor = true
font_weight = 700
format = "{:%I:%M %p}"

[widget.launcher]
anchor = true
capsule = true

[widget.media]
capsule_radius = 8
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.menu]
text = "☰"
type = "text"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.volume]
show_label = false

[widget.workspaces]
hide_when_empty = true
