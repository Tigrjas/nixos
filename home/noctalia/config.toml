[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.4999999888241291
    center = [ "workspaces", "spacer_2", "clock", "spacer_2", "tray" ]
    end = [ "group:g1" ]
    margin_edge = 0
    margin_ends = 100
    padding = 14
    position = "top"
    reserve_space = true
    scale = 1.0000000074505806
    smart_auto_hide = false
    start = [ "media" ]
    thickness = 34

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "on_primary"
        id = "g1"
        members = [
            "menu",
            "spacer_2",
            "network",
            "spacer_2",
            "bluetooth",
            "spacer_2",
            "volume",
            "spacer_2",
            "notifications",
            "spacer_2",
            "session"
        ]
        opacity = 0.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 25

[battery.device."/org/freedesktop/UPower/devices/battery_nintendo_switch_controller_battery_0005o057Eo2009x0008"]
warning_threshold = 0

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[control_center]
hidden_tabs = [ "media", "monitor", "calendar" ]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "wallpaper"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000012", "desktop-widget-0000000000000013" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000012]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 540.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "calendar"

    [desktop_widgets.widget.desktop-widget-0000000000000013]
    box_height = 0.0
    box_width = 0.0
    cx = 480.0
    cy = 430.1500244140625
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000013.settings]
        background = true
        color = "primary"
        font_family = ""
        forecast_days = 6
        shadow = false
        show_forecast = true

[dock]
active_monitor_only = true
enabled = true
icon_size = 36
reserve_space = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

